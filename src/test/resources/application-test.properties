# In-memory H2 standing in for SQL Server so the test suite runs without a database server.
# YEAR is reserved in H2 but used as a column name (appointments.year), hence NON_KEYWORDS.
# No MODE=MSSQLServer: it lets only one NULL into a unique index, like SQL Server, but
# Hibernate's H2 dialect emits plain unique indexes where the SQL Server dialect emits
# filtered ones (WHERE col IS NOT NULL), so the mode rejects data SQL Server accepts.
spring.datasource.url=jdbc:h2:mem:dms;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
