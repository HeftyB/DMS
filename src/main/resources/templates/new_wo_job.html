<!DOCTYPE html>
<html lang="en">
<body>
<div id="new_job_modal" class="job-modal" th:fragment="new-wo-job (ro)">
    <div class="job-modal-content">
        <div class="modal-header">
            <span class="close-new-job">&times;</span>
            <h2>Add New</h2>
        </div>
        <form action="#" th:action="@{/repair_orders/repair_order(id=${ro.id})}" class="modal-body" method="post">
            <label for="job-menu-select">Service Menu:</label>
            <select id="job-menu-select" name="concern">
                <option disabled selected value> -- select an option -- </option>
                <option value="LUBE, OIL & FILTER CHANGE">LUBE, OIL & FILTER CHANGE</option>
                <option value="AIR FILTER REPLACEMENT">AIR FILTER REPLACEMENT</option>
                <option value="CABIN AIR FILTER REPLACEMENT">CABIN AIR FILTER REPLACEMENT</option>
                <option value="BATTERY CHECK">BATTERY CHECK</option>
                <option value="BATTERY REPLACE">BATTERY REPLACE</option>
                <option value="BULB REPLACEMENT">BULB REPLACEMENT</option>
                <option value="COOLANT SERVICE">COOLANT SERVICE</option>
            </select>
            <p>OR</p>
            <label for="new_job">New Concern: </label>
            <textarea id="new_job" name="concern"></textarea>
            <button type="submit" class="modal-footer">Submit</button>
        </form>
    </div>


    <script>
        // Get the modal
        var modal = document.getElementById("new_job_modal")

        // Get the button that opens the modal
        var btn = document.getElementById("myBtn")

        // Get the <span> element that closes the modal
        var span = document.querySelector(".close-new-job")

        // When the user clicks the button, open the modal
        btn.onclick = function() {
            modal.style.display = "block"
        }

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none"
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none"
            }
        }
    </script>
</div>
</body>
</html>
