<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments::head (page_title='Appointments')}"></head>
<body>
<div class="page-wrapper">
<!--    <header th:insert="~{fragments::header-top (username = username)}"></header>-->
    <style th:inline="css">

        .schedule {
            display: grid;
            grid-gap: 1rem;
            grid-template-rows:
            [advisor] auto
            [#  th:each="block : ${tblocks}"  th:if="${block.advisor.id} == ${advisors.get(0).id}"]
                [t[(${block.startTimeCleanString()})]] 1fr [# th:if="${blockStat.last}"];[/]
            [/]
        }

        .dtime {
            grid-column: times;
            margin: 0;
        }

        .advisor-slot {
            text-align: center;
            grid-row: advisor;
            font-weight: bold;
        }

        .appt-block-time {
            text-align: center;
            color: white;
            pointer-events: none;
        }

        .date-change {
            display: flex;
            justify-content: center;
        }

        .appt-block {
            background-color: rgba(0, 0, 0, 0.72);
            z-index: 4;
            border: 2px solid white;
            border-radius: 20px;
            box-shadow: 5px 5px lightslategrey;
        }

        .appt-block:hover {
            transform: scale(1.01);
        }

        .appointment {
            border: 1px solid black;
            background-color: #5cb85c;
            text-align: center;
            z-index: 5;
            border-radius: 20px;
            box-shadow: 5px 5px lightslategrey;
            cursor: pointer;
        }

        .appointment:hover {
            transform: scale(1.01);
        }

        div .new-appt {
            padding: 2vh 2vw;
            max-width: 475px;
            /*line-height: 150%;*/
        }

        .new-appt form {
            /*display: table;*/
            margin: auto;
        }

        .new-appt * {
            /*margin: 10px;*/
        }

        .new-appt p {
            /*display: table-row;*/
            display: flex;
            flex-direction: column;
        }

        .new-appt input {
            margin: 15px 0;
            /*display: table-cell;*/
        }
        .new-appt label {
            /*display: table-cell;*/
        }


        /*@media screen and (min-device-width: 750px) {*/
        /*    .new-appt {*/
        /*        border: 2px solid black;*/
        /*        width: 60%;*/
        /*        margin: auto;*/
        /*    }*/
        /*}*/


        .address {
            min-width: 250px;
            max-width: 500px;
        }

        .advisor-back {
            grid-row: 2 / -1;
            opacity: 0.5;
            z-index: 1;
            padding: 15px;
        }

        .advisor-back:nth-child(odd) {
            background-color: deepskyblue;
        }

        .advisor-back:nth-child(even) {
            background-color: yellowgreen;
        }

        .close-new-appt:hover,
        .close-new-appt:focus {
            cursor: pointer;
            transform: scale(1.02);
        }

        .close-new-appt {
            color: #000;
            text-decoration: none;
            box-shadow: 3px 3px lightslategrey;
            float: right;
            font-size: 28px;
            font-weight: bold;
            border: 1px solid black;
            background-color: lightpink;
            padding: 5px;
            border-radius: 10px;
        }

        #new_date, #total_time, #advisor_name {
            background: rgba(215, 215, 215, 0.66);
            pointer-events: none;
        }

        .appt-vehicle-info, #year_make {
            display: flex;
        }

        .appt-vehicle-info label {
            /*font-size: small;*/
        }

        .year input {
            width: 50px;
        }

        .make input {
            width: 150px;
        }

        .vin input {
            width: 250px;
         }

        .new-appt label {
            font-size: small;
        }

        .new-appt-np {
            display: flex;
        }

        .new-appt-datetime {
            display: flex;
        }

        @media screen and (max-width: 1500px) {
            #advisor_name{
                display: none;
            }
        }

        @media screen and (max-width: 800px) {
            .new-appt-np, .new-appt-datetime, .new-appt-date, .new-appt-time, .new-appt-name, .new-appt-phone,
            .new-appt-email, .appt-vehicle-info, .year, .make, .model, .vin, #year_make {
                display: flex;
                flex-direction: column;
            }

            .new-appt {
                width: 95vw;
                /*height: 98vh;*/
                /*margin: auto;*/
            }
            .year input, .make input {
                width: auto;
            }


            .new-appt input {
                width: 250px;
                margin: auto;
            }

            .concern-select {

            }

            .concerns {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }

            .concerns ol {
                width: 80%;
            }
            .concerns input{
                width: 80%;
                font-size: x-small;
            }
            .close-new-appt {
                display: none;
            }

            .dtime, .appt-block {
                font-size: small;
                /*display: none;*/
            }

            .page-wrapper {
                width: 100%;
            }
        }

        .concern-select {

        }
        .concerns {

        }

        .del-apt-item {
            margin: 0 5px;
            cursor: pointer;
        }

        #new_appt_list li {
            margin: 5px 0;
        }





    </style>


    <h1 class="center-text">APPOINTMENTS: [[${{date}}]]</h1>
    <!-- date changer-->
    <div>
        <hr>
        <div class="date-change">
            <form action="" id="date_changer">
                <label for="date">Change Date: </label>
                <input type="date" id="date" name="date">
                <button type="submit">Submit</button>
            </form>

        </div>
        <hr>
    </div>

    <!--schedule-->
    <div class="schedule" th:style="${columns}">

        <!--  advisor-info(top  row)-->
        <span th:each="a : ${advisors}" class="advisor-slot" aria-hidden="true" th:style="|grid-column: advisor${a.id};|">[[${a.getName()}]]</span>

        <!--    time slot column values-->
        <h4 th:each="block : ${blocks}" th:if="${block.advisor.id} == ${advisors.get(0).id}" class="dtime"
            th:style="|grid-row: t${block.startTimeCleanString()};|">[[${{block.startDateTime.toLocalTime()}}]]</h4>

        <!--  alternating colored backing for each advisor column-->
        <div th:each="advisor: ${advisors}" class="advisor-back" th:style="|grid-column: advisor${advisor.id};|"></div>

        <!--  open appointment blocks-->
        <div th:each="ab : ${blocks}" th:if="${ab.isAvailable()}"
             th:id="|${ab.advisor?.id}_${ab.startDateTime.toLocalTime()}_${ab.startDateTime}|" class="appt-block"
             th:style="|grid-column: advisor${ab.advisor.id}; grid-row:t${ab.startTimeCleanString()} / t${ab.endTimeCleanString()};|">
            <h4 class="appt-block-time">[[${{ab.startDateTime.toLocalTime()}}]]</h4>
        </div>


        <!--  saved appointments-->
        <div th:each="appt : ${appointments}" class="appointment" th:id="|appt_${appt.id}|"
             th:style="|grid-column: advisor${appt.advisor.id}; grid-row: t${appt.startTimeCleanString()} / t${appt.endTimeCleanString()};|">

            <div sec:authorize="isAuthenticated()">

                <h3 th:id="|appt_${appt.id}_name|">[[${appt.contactInformation.contactName}]]</h3>
                <p th:id="|appt_${appt.id}_phone|">[[${appt.contactInformation.primaryPhone.number}]]</p>
                <p th:each="c : ${appt.concerns}" th:id="|appt_${appt.id}_concern_${cStat.count}|"
                   th:class="|appt_${appt.id}_concerns|">[[${{c}}]]</p>
                <form action="#" th:action="@{/appointments/delete}" class="appt-del-button-form" method="post">
                    <input type="hidden" th:id="|appt_${appt.id}_id|" th:value="${appt.id}" name="appt_id">
                    <button type="submit" class="appt-del-button">DELETE APPT</button>
                </form>
                <input type="hidden" th:id="|appt_${appt.id}_date|" th:value="${appt.startDateTime.toLocalDate()}">
                <input type="hidden" th:id="|appt_${appt.id}_start|" th:value="${appt.startDateTime.toLocalTime()}">
                <input type="hidden" th:id="|appt_${appt.id}_startDT|" th:value="${appt.startDateTime}">
                <input type="hidden" th:id="|appt_${appt.id}_endDT|" th:value="${appt.endDateTime}">
                <input type="hidden" th:id="|appt_${appt.id}_advisor|" th:value="${appt.advisor.id}">
                <input type="hidden" th:id="|appt_${appt.id}_email|" th:value="${appt.contactInformation.contactEmail}">

                <input type="hidden" th:id="|appt_${appt.id}_year|" th:value="${appt.year}">
                <input type="hidden" th:id="|appt_${appt.id}_make|" th:value="${appt.make}">
                <input type="hidden" th:id="|appt_${appt.id}_model|" th:value="${appt.model}">
                <input type="hidden" th:id="|appt_${appt.id}_vin|" th:value="${appt.vin}">


<!--                <input type="hidden" th:id="|appt_${appt.id}_address1|"-->
<!--                       th:value="${appt.contactInformation.address.addressLine1}">-->
<!--                <input type="hidden" th:id="|appt_${appt.id}_address2|"-->
<!--                       th:value="${appt.contactInformation.address.addressLine2}">-->
<!--                <input type="hidden" th:id="|appt_${appt.id}_city|" th:value="${appt.contactInformation.address.city}">-->
<!--                <input type="hidden" th:id="|appt_${appt.id}_state|" th:value="${appt.contactInformation.address.state}">-->
<!--                <input type="hidden" th:id="|appt_${appt.id}_zip|" th:value="${appt.contactInformation.address.zip.zip}">-->
            </div>
        </div>


    </div>


    <!--  appointment form modal-->
    <div class="job-modal">
        <div class="new-appt job-modal-content">
            <form action="#" th:action="@{/appointments/create}" method="post">
                <span class="close-new-appt">&times;</span>
                <div class="new-appt-datetime">
                    <div class="new-appt-date">
                        <label for="new_date">Date: </label>
                        <input type="date" id="new_date" name="date" th:value="${date}">
                        <input type="hidden" id="appt_id" value="0" name="id">
                    </div>


                    <div class="new-appt-time">

                        <label for="advisor_start_time">Appointment Time:</label>
                        <select name="advisor_start_time" id="advisor_start_time">
                            <option th:each="ab : ${blocks}"
                                    th:disabled="!${ab.isAvailable}"
                                    value=""
                                    th:value="|${ab.advisor.id}_${ab.startDateTime.toLocalTime()}|">
                                [[${{ab.startDateTime.toLocalTime()}}]] [[${ab.advisor?.getName()}]]
                            </option>
                        </select>
                        <input type="hidden" id="start_time" name="start_time">
                        <input type="hidden" id="start_DT" name="startDateTime">

                        <!--                    <label for="advisor_name">Advisor: </label>-->
                        <input type="hidden" id="advisor_name" th:value="${advisors[0].getName()}">
                        <input type="hidden" id="advisor_id" name="advisor.id" th:value="${advisors[0].id}">
                    </div>
                </div>


                <div class="new-appt-np">
                    <div class="new-appt-name">
                        <label for="contact_name">Contact Name:</label>
                        <input type="text" id="contact_name" name="contactInformation.contactName">
                    </div>

                    <div class="new-appt-phone">
                        <label for="contact_phone">Phone:</label>
                        <input type="text" id="contact_phone" name="contactInformation.primaryPhone.number">
                    </div>
                </div>

                <div class="new-appt-email">
                    <label for="contact_email">Email Address:</label>
                    <input type="text" id="contact_email" name="contactInformation.contactEmail" class="address">
                </div>

<!--                <p>-->
<!--                    <label for="contact_address_line_1">Address Line 1:</label>-->
<!--                    <input type="text" id="contact_address_line_1" name="contactInformation.address.addressLine1"-->
<!--                           class="address">-->
<!--                </p>-->

<!--                <p>-->
<!--                    <label for="contact_address_line_2">Address Line 2:</label>-->
<!--                    <input type="text" id="contact_address_line_2" name="contactInformation.address.addressLine2"-->
<!--                           class="address">-->
<!--                </p>-->

<!--                <p>-->


<!--                    <label for="address_city">City:</label>-->
<!--                    <input type="text" id="address_city" name="contactInformation.address.city">-->
<!--                </p>-->
<!--                <p>-->
<!--                    <label for="address_state">State:</label>-->
<!--                    <input type="text" id="address_state" name="contactInformation.address.state">-->
<!--                </p>-->

<!--                <p>-->
<!--                    <label for="address_zip">ZipCode: </label>-->
<!--                    <input type="text" id="address_zip" name="contactInformation.address.zip.zip">-->
<!--                </p>-->


                <div class="appt-vehicle-info">
                    <div id="year_make">
                        <div class="year">
                            <label for="year">Year:</label>
                            <input type="text" name="year" id="year">
                        </div>

                        <div class="make">
                            <label for="make">Make:</label>
                            <input type="text" name="make" id="make">
                        </div>
                    </div>
                    <div class="model">
                        <label for="model">Model:</label>
                        <input type="text" name="model" id="model">
                    </div>
                </div>
                <div class="vin">
                    <label for="vin">VIN: </label>
                    <input type="text" id="vin" name="vin">
                </div>

                <div class="concerns">
                    <h4>Appointment Items:</h4>
                    <ol id="new_appt_list">
                    </ol>
                    <div class="concern-select">
                        <label for="menu_items">New Items</label>
                        <select name="menu-items" id="menu_items">
                            <option th:each="mi : ${menu_items}" th:value="${mi.item}">[[${mi.item}]]</option>
                            <!--                        <option value="other">Other</option>-->
                        </select>
                        <button type="button" id="add_menu_button">+</button>
                    </div>
                </div>


                <p>
<!--                    <label for="total_time">Estimated Time Blocks:</label>-->
                    <input type="hidden" name="total_blocks" id="total_time">
                    <input type="hidden" id="appt_end_dt" name="endDateTime">
                </p>
                <div class="button-container">
                    <button type="button" id="appt_cancel_button">Cancel</button>
                    <button type="submit">Submit</button>
                </div>
            </form>
        </div>
    </div>


    <script th:inline="javascript">
        let smis = [[${menu_items}]],
            advisors = [[${advisors}]],
            clist = document.getElementById("new_appt_list"),
            apptBlocks = document.getElementsByClassName("appt-block"),
            selectMenu = document.getElementById("menu_items"),
            totalTime = document.getElementById("total_time"),
            advisorName = document.getElementById("advisor_name"),
            newDate = document.getElementById("new_date"),
            modal = document.querySelector(".job-modal"),
            span = document.querySelector(".close-new-appt"),
            newStart = document.getElementById("advisor_start_time"),
            startTime = document.getElementById("start_time"),
            contactName = document.getElementById("contact_name"),
            contactPhone = document.getElementById("contact_phone"),
            contactEmail = document.getElementById("contact_email"),
            apYear = document.getElementById("year"),
            apMake = document.getElementById("make"),
            apModel = document.getElementById("model"),
            apVin = document.getElementById("vin"),
            // contactAdd1 = document.getElementById("contact_address_line_1"),
            // contactAdd2 = document.getElementById("contact_address_line_2"),
            // contactCity = document.getElementById("address_city"),
            // contactState = document.getElementById("address_state"),
            // contactZip = document.getElementById("address_zip"),
            newEndDT = document.getElementById("appt_end_dt"),
            newStartDT = document.getElementById("start_DT"),
            menuButton = document.getElementById("add_menu_button"),
            newApptId = document.getElementById("appt_id")


        // click handler for adding menu items to new appointments
        menuButton.addEventListener("click", e => {
            e.preventDefault()

            // create new input for new concern / menu item
            let input = document.createElement("input")
            let smi = smis.find(s => s.item == selectMenu.value)
            let isOther = selectMenu.value == "OTHER"
            input.name = "concerns"


            // sets new input's value with selected menu item or placeholder
            if (isOther) {
                input.placeholder = "NEW CONCERN"
            } else {
                input.value = smi.item
            }

            // calculate estimated endtime
            newEndDT.value = addTimeBlocksToDTString(!newEndDT.value ? newStartDT.value : newEndDT.value, smi.blocks, 15)
            changeInputValue(totalTime, smi.blocks)

            // create list item to hold new input
            let li = document.createElement("li")
            li.appendChild(input)

            // delete concern button
            let but = document.createElement("button")
            but.classList.add("del-apt-item")
            but.innerText = "x"

            but.addEventListener("click", evt => {
                evt.preventDefault()
                newEndDT.value = addTimeBlocksToDTString(newEndDT.value, smi.blocks * -1, 15)
                changeInputValue(totalTime, smi.blocks * -1)
                li.remove()
            })

            // add concern delete button to list item
            li.appendChild(but)

            // add list item to concern list
            clist.appendChild(li)

            // change select value to null
            selectMenu.value = null
        })


        // click handler for open appointment blocks
        Array.from(apptBlocks).forEach(b => {
            b.addEventListener("click", e => {
                // show modal
                modal.style.display = "block"

                // get appointment info embedded in id
                let elId = e.target.id;

                let strings = elId.split("_")
                let advisorId = strings[0]
                let time = strings[1]
                let dateTime = strings[2]

                // set advisor in new appt form
                document.getElementById("advisor_id").value = advisorId
                let adv = advisors.find(ad => ad.id == advisorId)
                advisorName.value = `${adv.preferredName} ${adv.lastName}`

                // set start time & date, clear any old form data that may be hanging around
                newStart.value = `${advisorId}_${time}`
                startTime.value = time
                newStartDT.value = dateTime
                contactName.value = null
                contactPhone.value = null
                contactEmail.value = null
                apYear.value = null
                apMake.value = null
                apModel.value = null
                apVin.value = null
                // contactAdd1.value = null
                // contactAdd2.value = null
                // contactCity.value = null
                // contactState.value = null
                // contactZip.value = null
                newEndDT.value = null
                totalTime.value = null
                clist.innerHTML = ""
                // clist.appendChild(selectMenu)
                // clist.appendChild(menuButton)
            })
        })

        // onChange handler for new appt time selector
        newStart.onchange = e => {
            // get time info from event target
            let adTime = e.target.value
            let strings = adTime.split("_")
            let id = strings[0]
            let time = strings[1]

            // set updated advisor & datetime info in new appt form
            document.getElementById("advisor_id").value = id
            let ad = advisors.find(a => a.id == id)
            advisorName.value = `${ad.preferredName} ${ad.lastName}`
            newStart.value = `${id}_${time}`
            startTime.value = time
            newStartDT.value = `${newDate.value}T${startTime.value}`
            newEndDT.value = addTimeBlocksToDTString(newStartDT.value, totalTime.value, 15)
        }

        // close modal button
        span.onclick = function () {
            modal.style.display = "none"
        }
        document.getElementById("appt_cancel_button").onclick = function () {
            modal.style.display = "none"
        }

        // close modal if user clicks outside of modal
        window.onclick = function (event) {
            if (event.target == modal) {
                modal.style.display = "none"
            }
        }

        // existing appointment click handlers
        Array.from(document.getElementsByClassName("appointment")).forEach(a => {
            a.addEventListener("click", e => {
                // get info embedded in id
                let elId = e.target.id;
                let strings = elId.split("_")
                let apptId = strings[1]
                let aAdvisorId = document.getElementById(`${strings[0]}_${strings[1]}_advisor`).value
                let aAdvisor = advisors.find(ad => ad.id == aAdvisorId)

                // show modal
                modal.style.display = "block"

                // get all of existing appointment info
                let aName = document.getElementById(`${strings[0]}_${strings[1]}_name`).innerText,
                    aPhone = document.getElementById(`${strings[0]}_${strings[1]}_phone`).innerText,
                    aDate = document.getElementById(`${strings[0]}_${strings[1]}_date`).value,
                    aStart = document.getElementById(`${strings[0]}_${strings[1]}_start`).value,
                    aEndDT = document.getElementById(`${strings[0]}_${strings[1]}_endDT`).value,
                    aStartDT = document.getElementById(`${strings[0]}_${strings[1]}_startDT`).value,
                    aEmail = document.getElementById(`${strings[0]}_${strings[1]}_email`).value,
                    // aAddress1 = document.getElementById(`${strings[0]}_${strings[1]}_address1`).value,
                    // aAddress2 = document.getElementById(`${strings[0]}_${strings[1]}_address2`).value,
                    // aCity = document.getElementById(`${strings[0]}_${strings[1]}_city`).value,
                    // aState = document.getElementById(`${strings[0]}_${strings[1]}_state`).value,
                    // aZip = document.getElementById(`${strings[0]}_${strings[1]}_zip`).value,
                    aConcerns = document.getElementsByClassName(`${strings[0]}_${strings[1]}_concerns`),
                    aYear = document.getElementById(`${strings[0]}_${strings[1]}_year`).value,
                    aMake = document.getElementById(`${strings[0]}_${strings[1]}_make`).value,
                    aModel = document.getElementById(`${strings[0]}_${strings[1]}_model`).value,
                    aVin = document.getElementById(`${strings[0]}_${strings[1]}_vin`).value

                // set form values to existing appointment info
                newApptId = apptId
                newDate.value = aDate
                document.getElementById("appt_id").value = apptId
                newStart.value = `${aAdvisorId}_${aStart}`
                startTime.value = aStart
                newStartDT.value = aStartDT
                advisorName.value = `${aAdvisor.preferredName} ${aAdvisor.lastName}`
                contactName.value = aName
                contactPhone.value = aPhone
                contactEmail.value = aEmail
                apYear.value = aYear
                apMake.value = aMake
                apModel.value = aModel
                apVin.value = aVin
                // contactAdd1.value = aAddress1
                // contactAdd2.value = aAddress2
                // contactCity.value = aCity
                // contactState.value = aState
                // contactZip.value = aZip
                newEndDT.value = aEndDT

                // for each appt concern create & add concern input
                Array.from(aConcerns).forEach(el => {
                        let smi = smis.find(smi => smi.item == el.innerText)

                        // set estimated ending time for concern
                        newEndDT.value = addTimeBlocksToDTString(newEndDT.value, smi.blocks, 15)
                        changeInputValue(totalTime, smi.blocks)


                        let input = document.createElement("input")
                        input.name = "concerns"
                        input.value = el.innerText
                        let li = document.createElement("li")
                        li.appendChild(input)
                        let span = document.createElement("button")
                        span.classList.add("del-apt-item")
                        span.innerText = "x"

                        span.addEventListener("click", evt => {
                            newEndDT.value = addTimeBlocksToDTString(newEndDT.value, smi.blocks * -1, 15)
                            changeInputValue(totalTime, smi.blocks * -1)
                            li.remove()
                        })

                        li.appendChild(span)
                        clist.appendChild(li)
                    }
                )
            })
        })

        selectMenu.value = null


        // get all delete appointment buttons
        let delBUtts = document.getElementsByClassName("appt-del-button")

        // delete button click handlers
        Array.from(delBUtts).forEach(b => {
            b.addEventListener("click", e => {
                e.stopPropagation()
            })
        })

        // helper functions
        function changeInputValue(input, value) {
            let val = parseInt(input.value)
            if (!isNaN(val)) {
                input.value = val + value
            } else {
                input.value = value
            }
        }

        function addTimeBlocksToDTString(dateTimeString, numOfBlocks, blockInterval) {
            let sd = new Date(dateTimeString)
            let ed = new Date(sd.getTime() + ((numOfBlocks * blockInterval) * 60000))
            let hours = ed.getHours() < 10 ? "0" + ed.getHours() : ed.getHours(),
                minutes = ed.getMinutes() < 10 ? "0" + ed.getMinutes() : ed.getMinutes()
            return `${newDate.value}T${hours}:${minutes}`
        }
    </script>

</div>
</body>
