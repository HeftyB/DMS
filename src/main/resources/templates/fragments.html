<!DOCTYPE html>
<html lang="en">
<!--reusable header with a page_title parameter-->
<head th:fragment="head (page_title)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title th:text="${page_title}">Template Title</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!--horizontal navigation bar - inserted into a header-->
<nav class="navbar navbar-inverse navbar-fixed-top print-hide" th:fragment="header-top (username)">
    <div class="container">
        <ul class="nav-list">
            <li class="no-bullet-list nav-item"><a class="clean-link" href="#" th:href="@{/}">Home</a></li>
            <li class="no-bullet-list nav-item"><a class="clean-link" href="#" th:href="@{/repair_orders}">Repair
                Orders</a></li>
            <li class="no-bullet-list nav-item"><a class="clean-link" href="#" th:href="@{/appointments/}">Appointments</a></li>
            <li class="no-bullet-list nav-item"><a class="clean-link" href="#" th:href="@{/customers}">Customers</a>
            </li>
            <li class="no-bullet-list nav-item"><a class="clean-link" href="#" th:href="@{/vehicles}">Vehicles</a></li>
            <li class="no-bullet-list nav-item"><a class="clean-link" href="#">Parts</a></li>
            <li class="no-bullet-list nav-item"><a class="clean-link" href="#">Support</a></li>

            <li class="no-bullet-list nav-item"><a class="clean-link" th:href="@{/two}">Work-Orders</a></li>
            <!--            <li class="no-bullet-list nav-item"><a class="clean-link" href="#">User</a></li>-->
            <li sec:authorize="hasRole('ROLE_ADMIN')" class="no-bullet-list nav-item"><a class="clean-link" href="#"
                                                                                         th:href="@{/admin}">Admin</a>
            </li>
            <li id="nav_user_link" class="no-bullet-list nav-item nav-user-button" onmouseenter="toggleUserMenu()"
                onmouseleave="toggleUserMenu()">
                <span class="clean-link" th:text="${username} ? ${username} : 'User'">UPLogout</span>
                <div id="nav_user_menu" class="user-menu-closed">
                    <a class="clean-link nav-menu-item" href="#" th:href="@{/timeclock}" th:text="Time-Clock"></a>
                    <a class="clean-link nav-menu-item" href="#">User Profile</a>
                    <a class="clean-link nav-menu-item" href="#" th:href="@{/logout}" th:text="Logout"></a>
                </div>
            </li>
        </ul>


    </div>
</nav>

<div th:fragment="forward-back">
    <a class="clean-link back-button print-hide" href="javascript:window.history.back();">
        <button type="button">Back</button>
    </a>
    <!--    <a href="javascript:window.history.forward();">></a>-->
</div>

<div th:fragment="customer-list (customers)">
    <table>
        <tr>
            <th>Customer ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
        </tr>

        <tr th:each="customer : ${customers}">
            <td>
                <a class="clean-link" href="#" th:href="@{/customers/customer(id=${customer.id})}"
                   th:text="${customer.id}"></a>
            </td>
            <td>
                <a class="clean-link" href="#" th:href="@{/customers/customer(id=${customer.id})}"
                   th:text="${customer.getName()}"></a>
            </td>
            <td>
                <a class="clean-link" href="#" th:href="@{/customers/customer(id=${customer.id})}"
                   th:text="${customer.contactInformation.primaryPhone}"></a>
            </td>
            <td>
                <a class="clean-link" href="#" th:href="@{/customers/customer(id=${customer.id})}"
                   th:text="${customer.email}"></a>
            </td>
            <td>
                <a class="clean-link" href="#" th:href="@{/customers/customer(id=${customer.id})}"
                   th:text="${customer.address.getAddress()}"></a>
            </td>
        </tr>
    </table>
</div>


<div th:fragment="vehicle-list (vehicles)">
    <table>
        <tr>
            <th>ID</th>
            <th>INFO</th>
            <th>VIN</th>
            <th>Customer</th>
            <th>Last Seen</th>
        </tr>

        <tr th:each="vehicle : ${vehicles}">
            <td>
                <a class="clean-link" href="#" th:href="@{/vehicles/vehicle(id=${vehicle.id})}"
                   th:text="${vehicle.id}"></a>
            </td>
            <td>
                <a class="clean-link" href="#" th:href="@{/vehicles/vehicle(id=${vehicle.id})}"
                   th:text="${vehicle.getVehicleInfo()}"></a>
            </td>
            <td>
                <a class="clean-link" href="#" th:href="@{/vehicles/vehicle(id=${vehicle.id})}"
                   th:text="${vehicle.vin}"></a>
            </td>
            <td>
                <a class="clean-link" href="#" th:href="@{/vehicles/vehicle(id=${vehicle.id})}"
                   th:text="${vehicle.customer.getName()}"></a>
            </td>
            <td>
                <a class="clean-link" href="#" th:href="@{/vehicles/vehicle(id=${vehicle.id})}"
                   th:text="${'11/21/2004'}"></a>
            </td>
        </tr>
    </table>
</div>

<div th:fragment="contact-info-inputs">
    <div class="flex-between">
        <div class="flex-col">
            <label for="cname">Contact Name:</label>
            <input type="text" name="contactInformation.contactName" id="cname">
        </div>


        <div class="flex-col">
            <label for="cemail">Contact Email:</label>
            <input type="text" name="contactInformation.contactEmail" id="cemail">
        </div>
    </div>

    <div>
        <div class="flex-col">
            <label for="contact_addline1">Address Line 1:</label>
            <input type="text" name="contactInformation.address.addressLine1" id="contact_addline1">
        </div>

        <div class="flex-col">
            <label for="contact_addline2">Address Line 2:</label>
            <input type="text" name="contactInformation.address.addressLine2" id="contact_addline2">
        </div>

        <div class="flex-between">
            <div class="flex-col">
                <label for="contact_city">City:</label>
                <input type="text" name="contactInformation.address.city" id="contact_city">
            </div>

            <div class="flex-col">
                <label for="contact_state">State:</label>
                <input type="text" name="contactInformation.address.state" id="contact_state">
            </div>

            <div class="flex">
                <div class="flex-col">
                    <label for="contact_zip">Zipcode:</label>
                    <input type="text" name="contactInformation.address.zip.zip" id="contact_zip" class="zip">
                </div>

                <div class="flex-col">
                    <label for="contact_plus4" class="p4">+4:</label>
                    <input type="text" name="contactInformation.address.zip.plus4" id="contact_plus4" class="p4">
                </div>
            </div>
        </div>
    </div>

    <div>
        <div class="flex-between">
            <div class="flex">
                <div class="flex-col">
                    <label for="pphone">Primary Phone:</label>
                    <input type="text" name="contactInformation.primaryPhone.number" id="pphone" required>
                </div>
                <div class="flex-col">
                    <label for="pphoneext" class="ext">Ext:</label>
                    <input type="text" id="pphoneext" name="contactInformation.primaryPhone.ext" class="ext">
                </div>
            </div>

            <div class="flex">
                <div class="flex-col">
                    <label for="aphone1">Alt Phone:</label>
                    <input type="text" name="contactInformation.altPhone1.number" id="aphone1">
                </div>

                <div class="flex-col">
                    <label for="aphone1ext" class="ext">Ext:</label>
                    <input type="text" id="aphone1ext" name="contactInformation.altPhone.ext" class="ext">
                </div>
            </div>
        </div>
        <div class="flex-between">
            <div class="flex">
                <div class="flex-col">
                    <label for="aphone2">2nd Alt Phone:</label>
                    <input type="text" name="contactInformation.altPhone2.number" id="aphone2">
                </div>

                <div class="flex-col">
                    <label for="aphone2ext" class="ext">Ext:</label>
                    <input type="text" id="aphone2ext" name="contactInformation.altPhone2.ext" class="ext">
                </div>
            </div>

            <div class="flex">
                <div class="flex-col">
                    <label for="fax">Fax:</label>
                    <input type="text" name="contactInformation.fax.number" id="fax">
                </div>

                <div class="flex-col">
                    <label for="faxext" class="ext">Ext:</label>
                    <input type="text" id="faxext" name="contactInformation.fax.ext" class="ext">
                </div>
            </div>
        </div>

        <div class="flex-col">
            <label for="notes">Notes:</label>
            <textarea name="contactInformation.notes" id="notes" cols="100" rows="4"></textarea>
        </div>

    </div>
</div>

<div th:fragment="address-inputs">
    <div class="flex-col">
        <label for="addline1">Address Line 1:</label>
        <input type="text" name="address.addressLine1" id="addline1" required>
    </div>

    <div class="flex-col">
        <label for="addline2">Address Line 2:</label>
        <input type="text" name="address.addressLine2" id="addline2">
    </div>

    <div class="flex-between">
        <div class="flex-col">
            <label for="city">City:</label>
            <input type="text" name="address.city" id="city" required>
        </div>

        <div class="flex-col">
            <label for="state">State:</label>
            <input type="text" name="address.state" id="state" required>
        </div>

        <div class="flex">
            <div class="flex-col">
                <label for="zip">Zipcode:</label>
                <input type="text" name="address.zip.zip" id="zip" class="zip" required>
            </div>

            <div class="flex-col">
                <label for="plus4" class="p4">+4:</label>
                <input type="text" name="address.zip.plus4" id="plus4" class="p4">
            </div>
        </div>
    </div>
</div>


<!--footer to go with navigation header, this contains the needed js for the user drop down menu-->
<footer th:fragment="foot">
    <script>
        let m = document.querySelector("#nav_user_menu")

        let toggleUserMenu = () => {
            console.log(`menu=${m}`)
            m.classList.toggle("user-menu-closed")
            m.classList.toggle("user-menu-open")
        }

        document.querySelector("#nav_user_link")
            .addEventListener("click", e => toggleUserMenu())


    </script>
</footer>
</body>
</html>
