<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments::head (page_title='My Repair Orders')}"></head>
<body>
    <header th:insert="~{fragments::header-top (username=${username})}"></header>
    <h1 class="center-text" th:text="${username} + '\'s Repair Orders'"></h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Vehicle info</th>
            <th>Date Opened</th>
            <th># of days</th>
            <th>Priority</th>
        </tr>

        <tr th:each="r : ${ros}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.customer.getName()}"></td>
            <td th:text="${r.vehicle.getVehicleInfo()}"></td>
            <td th:text="${r.openDate}"></td>
            <td th:text="${r.id}"></td>
            <td th:text="${r.priority}"></td>
            <td></td>
        </tr>
    </table>

    <div class="container">
        <button type="button">Open New</button>
        <button type="button" id="open_modal">Search</button>
        <button type="button">User</button>
    </div>

    <div th:replace="~{search::search}"></div>


    <footer th:replace="~{fragments::foot}"></footer>
</body>
</html>
